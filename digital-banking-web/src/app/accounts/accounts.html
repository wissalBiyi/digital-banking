<div class="container mt-2">
  <div class="row">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">Account Search</div>
        <div class="card-body">
          <form [formGroup]="accountFormGroup" (ngSubmit)="handleSearchAccount()">
            <div class="input-group mb-3">
              <label class="input-group-text">Account ID :</label>
              <input type="text" formControlName="accountId" class="form-control">
              <button class="btn btn-info text-white"><i class="bi bi-search"></i> Search</button>
            </div>
          </form>

          <ng-container *ngIf="accountDetails$ | async as accountDetails">
            <div class="mb-2">
              <label>Account ID : </label> <label class="fw-bold">{{accountDetails.accountId}}</label>
            </div>
            <div class="mb-2">
              <label>Balance : </label> <label class="fw-bold">{{accountDetails.balance | number:'1.2-2'}} DH</label>
            </div>

            <table class="table mt-3">
              <thead>
              <tr>
                <th>Date</th><th>Type</th><th>Amount</th><th>Description</th>
              </tr>
              </thead>
              <tbody>
              <tr *ngFor="let op of accountDetails.accountOperationDTOS">
                <td>{{op.operationDate | date:'dd-MM-yyyy HH:mm'}}</td>
                <td>
                  <span [className]="op.type === 'CREDIT' ? 'badge bg-success' : 'badge bg-danger'">{{op.type}}</span>
                </td>
                <td>{{op.amount | number:'1.2-2'}}</td>
                <td>{{op.description}}</td>
              </tr>
              </tbody>
            </table>

            <ul class="nav nav-pills">
              <li *ngFor="let item of [].constructor(accountDetails.totalPages); let page=index">
                <a (click)="gotoPage(page)" [ngClass]="page==currentPage?'btn btn-info text-white':'btn btn-outline-info'" class="ms-1 mt-1">{{page}}</a>
              </li>
            </ul>
          </ng-container>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card" *ngIf="accountDetails$ | async">
        <div class="card-header">Operations</div>
        <div class="card-body">
          <form [formGroup]="operationFormGroup" (ngSubmit)="handleAccountOperation()">
            <div class="form-check form-check-inline mb-3">
              <input class="form-check-input" type="radio" formControlName="operationType" value="CREDIT" id="credit">
              <label class="form-check-input-label" for="credit">CREDIT</label>
            </div>
            <div class="form-check form-check-inline mb-3">
              <input class="form-check-input" type="radio" formControlName="operationType" value="DEBIT" id="debit">
              <label class="form-check-input-label" for="debit">DEBIT</label>
            </div>
            <div class="form-check form-check-inline mb-3">
              <input class="form-check-input" type="radio" formControlName="operationType" value="TRANSFER" id="transfer">
              <label class="form-check-input-label" for="transfer">TRANSFER</label>
            </div>

            <div class="mb-3" *ngIf="operationFormGroup.value.operationType === 'TRANSFER'">
              <label class="form-label">Account Destination :</label>
              <input type="text" formControlName="accountDestination" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">Amount :</label>
              <input type="number" formControlName="amount" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">Description :</label>
              <input type="text" formControlName="description" class="form-control">
            </div>
            <button class="btn btn-success d-grid w-100">Save Operation</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
