<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow mt-5">
        <div class="card-header bg-dark text-white text-center py-3">
          <h4 class="mb-0">Digital Banking Login</h4>
        </div>
        <div class="card-body p-4">
          <div *ngIf="errorMessage" class="alert alert-danger text-center py-2">
            {{ errorMessage }}
          </div>

          <form [formGroup]="loginFormGroup" (ngSubmit)="handleLogin()">
            <div class="mb-3">
              <label class="form-label fw-bold">Username</label>
              <input type="text" formControlName="username" class="form-control" placeholder="Ex: admin">
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">Password</label>
              <input type="password" formControlName="password" class="form-control" placeholder="••••••••">
            </div>

            <button [disabled]="loginFormGroup.invalid" type="submit" class="btn btn-dark w-100 mt-2 py-2">
              Sign In
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
