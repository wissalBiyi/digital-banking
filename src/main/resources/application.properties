server.port=8085

# Connexion à MySQL de XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/E-BANK?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Hibernate pour créer les tables automatiquement
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- CONFIGURATION SÉCURITÉ & JWT ---
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG

# Clé secrète de 64 caractères (Obligatoire pour HS512)
app.secret.key=1234567890123456789012345678901234567890123456789012345678901234